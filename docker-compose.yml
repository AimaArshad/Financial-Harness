# Local run:  docker compose up --build      (needs a .env file next to this one)
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped

  web:
    build: .
    ports: ["8501:8501"]
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    volumes: ["fh_logs:/app/logs"]
    depends_on: [redis]
    restart: unless-stopped

  worker:
    build: .
    command: celery -A celery_app worker --loglevel=info --concurrency=2
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    volumes: ["fh_logs:/app/logs"]
    depends_on: [redis]
    healthcheck:
      disable: true
    mem_limit: 1g
    restart: unless-stopped

volumes:
  fh_logs: